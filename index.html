    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color:var(--ink);
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:48px 18px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:34px 24px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
    margin:0 auto 20px;
    background-size:cover;
    background-position:center;
    border:2px solid var(--ink);
    flex-shrink:0;
  }
  h1{
    text-align:center;
    font-size:28px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin:0 0 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    word-break:break-word;
  }
  .tagline{
    text-align:center;
    font-size:14px;
    color:#ffd6ec;
    margin:0 0 26px;
    line-height:1.5;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .featured{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    text-decoration:none;
    color:var(--accent-ink);
    background:var(--accent);
    border:1.5px solid var(--accent);
    border-radius:16px;
    padding:16px 18px;
    font-size:14.5px;
    font-weight:800;
    line-height:1.35;
    letter-spacing:0.01em;
    margin-bottom:24px;
    box-shadow: 0 4px 18px rgba(255,47,146,0.35);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .featured:hover, .featured:focus-visible{
    transform:translateY(-1px);
    box-shadow: 0 6px 22px rgba(255,47,146,0.5);
    outline:none;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .links a{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--ink);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:15px 18px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
    background:rgba(255,255,255,0.06);
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .links a:hover, .links a:focus-visible{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
    transform:translateY(-1px);
    outline:none;
  }
  footer{
    text-align:center;
    margin-top:28px;
    font-size:11px;
    color:#ffd6ec;
    letter-spacing:0.03em;
    opacity:0.75;
  }

  /* Larger screens (laptop/desktop): slightly roomier card, bigger type */
  @media (min-width:700px){
    body{ padding:80px 20px; }
    .card{ max-width:460px; padding:42px 34px; }
    h1{ font-size:32px; }
    .tagline{ font-size:15px; }
    .links a, .featured{ font-size:16px; }
  }

  /* Very small phones: tighten spacing */
  @media (max-width:340px){
    .card{ padding:26px 18px; }
    h1{ font-size:24px; }
  }

  /* Respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce){
    .links a, .featured{ transition:none; }
  }
</style>

<div class="card">
  <div class="avatar" id="avatar"></div>
  <h1 id="name"></h1>
  <p class="tagline" id="tagline"></p>
  <a class="featured" id="featured"></a>
  <div class="links" id="links"></div>
  <footer>a free page, made by hand</footer>
</div>

<script>
  document.getElementById('name').textContent = profile.name;
  document.getElementById('tagline').textContent = profile.tagline;

  const avatarEl = document.getElementById('avatar');
  if (profile.avatar) {
    avatarEl.style.backgroundImage = `url(${profile.avatar})`;
  } else {
    avatarEl.textContent = profile.name.trim().charAt(0).toUpperCase();
  }

  const featuredEl = document.getElementById('featured');
  featuredEl.textContent = featured.label;
  featuredEl.href = featured.url;
  if (!featured.url.startsWith('mailto:')) {
    featuredEl.target = '_blank';
    featuredEl.rel = 'noopener noreferrer';
  }

  const linksEl = document.getElementById('links');
  links.forEach(link => {
    const a = document.createElement('a');
    a.href = link.url;
    a.textContent = link.label;
    if (!link.url.startsWith('mailto:')) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
    linksEl.appendChild(a);
  });
</script>

</body>
</html>
